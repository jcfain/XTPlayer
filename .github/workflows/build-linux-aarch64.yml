# =============================================================================
# XTPlayer — standalone Linux aarch64 build
#
# Build ONLY the Linux aarch64 AppImage (cross-compiled) on demand (Run
# workflow button), without building the other platforms. Delegates to the
# shared reusable pipeline in build.yml (platform: linux-aarch64), so it
# stays in lockstep with nightly / release.
#
# The artifact is published to the rolling 'nightly' GitHub Release. The
# version is fixed to 'nightly' so the file name matches the nightly Linux
# aarch64 asset and REPLACES it (action-gh-release overwrites same-named
# assets); the other platform assets and the release notes are left untouched.
# The 'nightly' tag is moved to the built commit so the auto-generated source
# archives stay fresh. It never creates a versioned release.
# =============================================================================
name: Build Linux aarch64 (standalone)

on:
  workflow_dispatch:
    inputs:
      player-branch:
        description: 'XTPlayer branch to build (Development or main)'
        required: true
        default: 'Development'
        type: string
      engine-branch:
        description: 'XTEngine branch to build against (Development or main)'
        required: true
        default: 'Development'
        type: string

jobs:
  build:
    name: Build Linux aarch64 (AppImage, cross)
    uses: ./.github/workflows/build.yml
    with:
      player-branch: ${{ inputs.player-branch }}
      engine-branch: ${{ inputs.engine-branch }}
      # Fixed 'nightly' so the artifact name matches the rolling nightly
      # release's Linux aarch64 asset and REPLACES it (see the publish job).
      version: nightly
      platform: linux-aarch64

  publish:
    name: Publish to nightly release
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Flatten artifacts
        run: |
          rm -rf dist/xtp-web   # internal web-bundle artifact, not a release asset
          find dist -type f -exec mv {} dist/ \;
      - name: Publish to rolling 'nightly' release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          files: |
            dist/*
      - name: Refresh source archives (move nightly tag to the built commit)
        # GitHub's auto-generated "Source code (zip/tar.gz)" are built from the
        # commit the 'nightly' TAG points to, which stays frozen at the commit
        # the release was first created on. Re-uploading assets / updating the
        # release name never moves the tag, so the source archives go stale.
        # Move the tag to the HEAD of the branch we just built so the source
        # archives match the binaries.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_BRANCH: ${{ inputs.player-branch }}
        run: |
          set -euo pipefail
          sha=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/branches/${BUILD_BRANCH}" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["commit"]["sha"])')
          echo "Moving 'nightly' tag to ${BUILD_BRANCH} HEAD: ${sha}"
          curl -fsSL -X PATCH \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/tags/nightly" \
            -d "{\"sha\": \"${sha}\", \"force\": true}"