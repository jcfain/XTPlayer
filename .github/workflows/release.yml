# =============================================================================
# XTPlayer — release builds
#
# Triggered by pushing a version tag (v*) from main. Builds XTPlayer (main)
# against XTEngine (main) for all four platforms and publishes the artifacts
# as a GitHub Release with auto-generated notes.
#
# To cut a release:
#   git checkout main && git pull
#   git tag v0.6.10
#   git push origin v0.6.10
# =============================================================================
name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  web:
    name: Angular web bundle (shared)
    runs-on: ubuntu-24.04
    steps:
      # Built ONCE here and shared by both build.yml and flatpak.yml (which
      # pass web-bundle-artifact: xtp-web to skip their own local build).
      - name: Checkout XTEngine
        uses: actions/checkout@v4
        with:
          repository: jcfain/XTEngine
          ref: main
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/wwwsrc/package-lock.json
      - name: Install npm deps
        working-directory: src/wwwsrc
        run: npm ci
      - name: Build (production)
        working-directory: src/wwwsrc
        run: |
          npm run set-version
          npx ng build --configuration production
      - name: Package bundle
        run: tar -cJf xtp-web.tar.xz -C src/wwwsrc/dist/xtp-web/browser .
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: xtp-web
          path: xtp-web.tar.xz
          retention-days: 1

  build:
    name: Build all platforms
    needs: web
    uses: ./.github/workflows/build.yml
    with:
      player-branch: main
      engine-branch: main
      version: ${{ github.ref_name }}
      web-bundle-artifact: xtp-web

  flatpak:
    name: Build Flatpak
    needs: web
    uses: ./.github/workflows/flatpak.yml
    with:
      player-branch: main
      engine-branch: main
      version: ${{ github.ref_name }}
      web-bundle-artifact: xtp-web

  publish:
    name: Create release
    needs: [build, flatpak]
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Flatten artifacts
        run: |
          rm -rf dist/xtp-web   # internal web-bundle artifact, not a release asset
          find dist -type f -exec mv {} dist/ \;
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: XTPlayer ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Artifacts:
            * Linux x86_64 + aarch64 AppImages
            * Windows x86_64 zip
            * macOS universal (arm64 + x86_64) DMG
            * Flatpak bundles x86_64 + aarch64 (self-contained; base pulled from Flathub)

            > **macOS:** the DMG is ad-hoc signed (no Apple Developer account).
            > First launch: right-click the app → **Open** (or
            > `xattr -d com.apple.quarantine /Applications/XTPlayer.app`).

            > **Flatpak:** download the `xtp-flatpak-<arch>-<tag>.flatpak` asset, then
            > `flatpak install xtp-flatpak-<arch>-<tag>.flatpak`
          files: |
            dist/*
