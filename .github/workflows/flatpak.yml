# =============================================================================
# XTPlayer — Flatpak build pipeline (reusable)
#
# Called by nightly.yml (Development) and release.yml (main / v* tags), the
# same pattern as build.yml. Also runnable standalone ("Run workflow").
#
# Builds the XTPlayer Flatpak (io.github.jcfain.XTPlayer) on top of the
# standard org.freedesktop.Platform 26.08 base (from Flathub). Qt6 is built
# INTO the app (only the modules the app uses - it is a pure QtWidgets app),
# so the deliverable is a small ~60-120MB .flatpak bundle, NOT a 3.4GB
# combined runtime repo.
#
#   - web job:          Angular bundle (artifact: xtp-web-flatpak; named
#                       differently from build.yml's xtp-web so both can run
#                       in the same workflow run)
#   - flatpak-<arch>:   Qt6 + FFmpeg + XTPlayer built on the freedesktop base
#                       -> one small .flatpak bundle per arch (base pulled
#                       from Flathub on install)
#
# aarch64 builds NATIVE on the ubuntu-24.04-arm runner - no qemu/binfmt,
# no cross toolchain (replaces the fragile AppImage cross pipeline).
# =============================================================================
name: Flatpak

on:
  workflow_call:
    inputs:
      player-branch:
        description: 'XTPlayer branch to build'
        required: true
        type: string
      engine-branch:
        description: 'XTEngine branch to build against'
        required: true
        type: string
      version:
        description: 'Version string for artifact names (e.g. v0.6.11b, nightly)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      player-branch:
        description: 'XTPlayer branch to build'
        required: true
        default: Development
        type: string
      engine-branch:
        description: 'XTEngine branch to build against'
        required: true
        default: Development
        type: string
      version:
        description: 'Version string for artifact names (e.g. v0.6.11b, dev)'
        required: true
        default: dev
        type: string

jobs:
  web:
    name: Angular web bundle
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout XTEngine
        uses: actions/checkout@v4
        with:
          repository: jcfain/XTEngine
          ref: ${{ inputs.engine-branch }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/wwwsrc/package-lock.json
      - name: Install npm deps
        working-directory: src/wwwsrc
        run: npm ci
      - name: Build (production)
        working-directory: src/wwwsrc
        run: |
          npm run set-version
          npx ng build --configuration production
      - name: Package bundle
        run: tar -cJf xtp-web.tar.xz -C src/wwwsrc/dist/xtp-web/browser .
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: xtp-web-flatpak
          path: xtp-web.tar.xz
          if-no-files-found: error
          retention-days: 1

  version-check:
    name: Version guard (tag vs XTEngine_global.h)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout XTEngine
        uses: actions/checkout@v4
        with:
          repository: jcfain/XTEngine
          ref: ${{ inputs.engine-branch }}
      - name: Verify version input matches the header
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          # XTEngine_global.h is the single source of truth for the app
          # version (About dialog, Flatpak .desktop stamp). For release
          # builds the version input is the git tag - it must match, or
          # the released artifact name and the app's displayed version
          # drift apart.
          HEADER=$(awk '/#define VERSION_MAJOR/{m=$3} /#define VERSION_MINOR/{n=$3} /#define VERSION_REVISION/{r=$3} /#define VERSION_PHASE/{p=$3} END{printf "%d.%d.%d%s", m, n, r, p}' src/XTEngine_global.h)
          echo "XTEngine_global.h version: $HEADER"
          case "$VERSION_INPUT" in
            v*)
              TAG=${VERSION_INPUT#v}
              if [ "$TAG" != "$HEADER" ]; then
                echo "::error::version input '$VERSION_INPUT' does not match XTEngine_global.h ('$HEADER') - bump the header before tagging"
                exit 1
              fi
              echo "tag matches header: $TAG"
              ;;
            *)
              echo "non-release version '$VERSION_INPUT' - no tag check"
              ;;
          esac

  flatpak:
    name: XTPlayer Flatpak (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [web, version-check]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout XTPlayer
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.player-branch }}
      - name: Clone XTEngine (sibling layout, as the .pro files expect)
        run: git clone --depth 1 --branch ${{ inputs.engine-branch }} https://github.com/jcfain/XTEngine.git XTEngine
      - name: Install flatpak + jq
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder jq
      - name: Add flathub remote (freedesktop deps for the build)
        run: flatpak --user remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Download web bundle
        uses: actions/download-artifact@v4
        with:
          name: xtp-web-flatpak
      - name: Patch manifest for dev build (local sources)
        run: bash flatpak/patch-manifest.sh flatpak/manifest.json xtp-web.tar.xz manifest-patched.json ${{ matrix.arch }}
      - name: Cache app build
        uses: actions/cache@v4
        with:
          # flatpak-builder's state lives in .flatpak-builder/ (not "build"/".ccache");
          # the ostree module cache is content-addressed, so a stable key is safe:
          # tagged modules (dav1d/aom/ffmpeg) are reused, dir/file modules rebuild
          # when their content changes.
          path: .flatpak-builder/cache
          key: xtp-flatpak-${{ matrix.arch }}-v2
      - name: Install freedesktop runtime + SDK from Flathub
        run: |
          # The app is built on the standard freedesktop base; Qt6 is built
          # INTO the app by the manifest (no custom runtime to host). Install
          # the base + SDK from Flathub so flatpak-builder finds them.
          flatpak --user install --noninteractive flathub \
            org.freedesktop.Platform/${{ matrix.arch }}/26.08 \
            org.freedesktop.Sdk/${{ matrix.arch }}/26.08
      - name: Build app (Qt6 + XTPlayer)
        run: |
          # --user: matches the --user flathub remote added above. Without it
          # flatpak-builder targets the system installation and cannot see it.
          # --disable-rofiles-fuse: current flatpak-builder mounts the appdir
          # read-only during the "Cleaning up" phase (rofiles-fuse); disable it
          # for a writable appdir (the top-level cleanup runs there).
          # --repo=repo: commit the build to a repo so build-bundle can package it.
          flatpak-builder --user --ccache --arch=${{ matrix.arch }} --disable-rofiles-fuse --repo=repo build manifest-patched.json
      - name: Update repo
        run: flatpak build-update-repo repo
      - name: Size breakdown (per-component)
        run: |
          # flatpak-builder --repo=repo consumes the appdir (build/ becomes a
          # repo, not an app tree), so extract the app from the local repo into
          # the user installation and analyze the installed files. --offline +
          # --no-deps keep it hermetic (the freedesktop base is already
          # installed from the Flathub step above).
          flatpak --user install --offline --no-deps -y "$(pwd)/repo" io.github.jcfain.XTPlayer
          APP=$(find "$HOME/.local/share/flatpak/app/io.github.jcfain.XTPlayer" -maxdepth 3 -type d -name files 2>/dev/null | head -1)
          if [ -z "$APP" ] || [ ! -e "$APP" ]; then
            echo "::error::could not locate the installed app files dir"
            exit 1
          fi
          echo "=== APP=$APP ==="
          ls -la "$APP" | head -20
          echo
          echo "=== Top-level /app components ==="
          du -sh "$APP"/* 2>/dev/null | sort -rh
          echo
          echo "=== Key dirs ==="
          for d in lib lib/cmake lib/qt6 plugins include bin share; do
            [ -e "$APP/$d" ] && du -sh "$APP/$d" 2>/dev/null
          done
          echo
          echo "=== Qt libs vs FFmpeg (inside /app/lib) ==="
          echo "  Qt6 libs count: $(ls "$APP"/lib/libQt6*.so* 2>/dev/null | wc -l)"
          echo "  FFmpeg libs: $(ls "$APP"/lib/libav* "$APP"/lib/libsw* 2>/dev/null | wc -l)"
          echo
          echo "=== TTS (texttospeech plugins + speech-dispatcher) ==="
          ls -la "$APP"/lib/plugins/texttospeech/ 2>/dev/null || echo "  (no texttospeech plugins dir)"
          ls "$APP"/bin/speech-dispatcher "$APP"/lib/libspeechd.so*" 2>/dev/null || echo "  (speech-dispatcher not installed)"
          echo
          echo "=== Top 25 largest files in /app ==="
          find "$APP" -type f -printf '%s\t%p\n' 2>/dev/null | sort -rn | head -25 | \
            awk -F'\t' '{printf "  %.1f MB  %s\n", $1/1048576, $2}'
      - name: Package app as a .flatpak bundle
        run: |
          # A bundle contains only the app (Qt6 + XTPlayer + FFmpeg + web); the
          # freedesktop base is referenced by id and pulled from Flathub on
          # install. This is ~60-120MB, not the 3.4GB combined repo.
          flatpak build-bundle repo \
            "xtp-flatpak-${{ matrix.arch }}-${{ inputs.version }}.flatpak" \
            io.github.jcfain.XTPlayer
      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v4
        with:
          name: xtp-flatpak-${{ matrix.arch }}
          path: xtp-flatpak-${{ matrix.arch }}-${{ inputs.version }}.flatpak
          if-no-files-found: error