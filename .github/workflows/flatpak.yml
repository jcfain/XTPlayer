# =============================================================================
# XTPlayer — Flatpak build pipeline (reusable)
#
# Called by nightly.yml (Development) and release.yml (main / v* tags), the
# same pattern as build.yml. Also runnable standalone ("Run workflow").
#
# Builds the XTPlayer Flatpak (io.github.jcfain.XTPlayer) on top of
# org.kde.Platform 6.12-beta (built once per arch from KDE's manifests,
# since 6.12 is not on Flathub yet - see flatpak/README.md).
#
#   - web job:          Angular bundle (artifact: xtp-web-flatpak; named
#                       differently from build.yml's xtp-web so both can run
#                       in the same workflow run)
#   - runtime-<arch>:   org.kde.Platform 6.12-beta repo (cached, incremental)
#   - flatpak-<arch>:   app built INTO the runtime repo -> one combined
#                       repo tarball per arch (single remote for users)
#
# aarch64 builds NATIVE on the ubuntu-24.04-arm runner - no qemu/binfmt,
# no cross toolchain (replaces the fragile AppImage cross pipeline).
# =============================================================================
name: Flatpak

on:
  workflow_call:
    inputs:
      player-branch:
        description: 'XTPlayer branch to build'
        required: true
        type: string
      engine-branch:
        description: 'XTEngine branch to build against'
        required: true
        type: string
      version:
        description: 'Version string for artifact names (e.g. v0.6.11b, nightly)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      player-branch:
        description: 'XTPlayer branch to build'
        required: true
        default: Development
        type: string
      engine-branch:
        description: 'XTEngine branch to build against'
        required: true
        default: Development
        type: string
      version:
        description: 'Version string for artifact names (e.g. v0.6.11b, dev)'
        required: true
        default: dev
        type: string
      cache-bust:
        description: 'Bump to force a full runtime rebuild'
        required: false
        default: ''
        type: string

env:
  RUNTIME_BRANCH: qt6.12

jobs:
  web:
    name: Angular web bundle
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout XTEngine
        uses: actions/checkout@v4
        with:
          repository: jcfain/XTEngine
          ref: ${{ inputs.engine-branch }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/wwwsrc/package-lock.json
      - name: Install npm deps
        working-directory: src/wwwsrc
        run: npm ci
      - name: Build (production)
        working-directory: src/wwwsrc
        run: |
          npm run set-version
          npx ng build --configuration production
      - name: Package bundle
        run: tar -cJf xtp-web.tar.xz -C src/wwwsrc/dist/xtp-web/browser .
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: xtp-web-flatpak
          path: xtp-web.tar.xz
          if-no-files-found: error
          retention-days: 1

  runtime:
    name: KDE runtime 6.12-beta (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout XTPlayer (for the build script)
        uses: actions/checkout@v4
        with:
          # Same branch as the app job: the runtime job must see the flatpak/
          # dir from the branch being BUILT, not the caller's (dispatch and
          # schedule run on the default branch, which may lag behind).
          ref: ${{ inputs.player-branch }}
      - name: Install flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder
      - name: Cache runtime build
        uses: actions/cache@v4
        with:
          # Only the ostree module cache (.flatpak-builder/cache/,
          # ~3GB per arch). flatpak-builder's reuse decision is entirely
          # an ostree ref lookup in that repo (builder_cache_lookup); the
          # build/ trees, downloads/ and ccache/ are only touched when a
          # stage actually compiles. Caching them too put the two arch
          # entries over actions/cache's 10GB per-repo total limit (shared
          # with the other workflows' caches), so GitHub's LRU GC kept
          # evicting one arch's entry.
          path: kde-runtime-build/kde-runtime/.flatpak-builder/cache
          key: kde-runtime-v2-${{ matrix.arch }}-${{ env.RUNTIME_BRANCH }}-${{ inputs.cache-bust }}
          restore-keys: |
            kde-runtime-v2-${{ matrix.arch }}-${{ env.RUNTIME_BRANCH }}-
      - name: Build org.kde.Platform 6.12-beta
        run: bash flatpak/build-kde-runtime.sh ${{ matrix.arch }} kde-runtime-build
      - name: Upload runtime repo
        uses: actions/upload-artifact@v4
        with:
          name: xtp-runtime-${{ matrix.arch }}
          path: kde-runtime-build/xtp-kde-runtime-6.12-beta-${{ matrix.arch }}.tar.xz
          if-no-files-found: error
          retention-days: 1

  version-check:
    name: Version guard (tag vs XTEngine_global.h)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout XTEngine
        uses: actions/checkout@v4
        with:
          repository: jcfain/XTEngine
          ref: ${{ inputs.engine-branch }}
      - name: Verify version input matches the header
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          # XTEngine_global.h is the single source of truth for the app
          # version (About dialog, Flatpak .desktop stamp). For release
          # builds the version input is the git tag - it must match, or
          # the released artifact name and the app's displayed version
          # drift apart.
          HEADER=$(awk '/#define VERSION_MAJOR/{m=$3} /#define VERSION_MINOR/{n=$3} /#define VERSION_REVISION/{r=$3} /#define VERSION_PHASE/{p=$3} END{printf "%d.%d.%d%s", m, n, r, p}' src/XTEngine_global.h)
          echo "XTEngine_global.h version: $HEADER"
          case "$VERSION_INPUT" in
            v*)
              TAG=${VERSION_INPUT#v}
              if [ "$TAG" != "$HEADER" ]; then
                echo "::error::version input '$VERSION_INPUT' does not match XTEngine_global.h ('$HEADER') - bump the header before tagging"
                exit 1
              fi
              echo "tag matches header: $TAG"
              ;;
            *)
              echo "non-release version '$VERSION_INPUT' - no tag check"
              ;;
          esac

  flatpak:
    name: XTPlayer Flatpak (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [web, runtime, version-check]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout XTPlayer
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.player-branch }}
      - name: Clone XTEngine (sibling layout, as the .pro files expect)
        run: git clone --depth 1 --branch ${{ inputs.engine-branch }} https://github.com/jcfain/XTEngine.git XTEngine
      - name: Install flatpak + jq
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder jq
      - name: Add flathub remote (freedesktop deps for the build)
        run: flatpak --user remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Download web bundle
        uses: actions/download-artifact@v4
        with:
          name: xtp-web-flatpak
      - name: Download runtime repo
        uses: actions/download-artifact@v4
        with:
          name: xtp-runtime-${{ matrix.arch }}
      - name: Unpack runtime repo as the app repo base
        run: tar -xJf xtp-kde-runtime-6.12-beta-${{ matrix.arch }}.tar.xz
      - name: Inspect runtime repo refs (diagnostic)
        run: |
          echo "=== refs committed by the runtime job ==="
          find repo/refs -type f | sort
          echo "=== summary (first 30 lines) ==="
          bunzip2 -c repo/summary 2>/dev/null | head -30 || true
          echo "=== remote check ==="
          flatpak --user remote-add --if-not-exists --no-gpg-verify xtp-local file://$PWD/repo
          flatpak --user remote-ls xtp-local | head -20
      - name: Patch manifest for dev build (local sources)
        run: bash flatpak/patch-manifest.sh flatpak/manifest.json xtp-web.tar.xz manifest-patched.json ${{ matrix.arch }}
      - name: Cache app build
        uses: actions/cache@v4
        with:
          # flatpak-builder's state lives in .flatpak-builder/ (not "build"/".ccache");
          # the ostree module cache is content-addressed, so a stable key is safe:
          # tagged modules (dav1d/aom/ffmpeg) are reused, dir/file modules rebuild
          # when their content changes.
          path: .flatpak-builder/cache
          key: xtp-flatpak-${{ matrix.arch }}-v1
      - name: Install KDE runtime + SDK from local repo
        run: |
          # Explicit install so flatpak-builder finds the refs in the
          # installation (its remote ref resolution has been flaky for
          # both the SDK and the Platform). Fails loudly if a ref is
          # missing from the repo.
          # (GPG is already disabled on the xtp-local remote itself.)
          flatpak --user install --noninteractive xtp-local \
            org.kde.Platform/${{ matrix.arch }}/6.12-beta \
            org.kde.Sdk/${{ matrix.arch }}/6.12-beta
      - name: Build app into the runtime repo
        run: |
          # --user: matches the --user remotes added above (flathub,
          # xtp-local). Without it flatpak-builder targets the system
          # installation and cannot see them.
          # --disable-rofiles-fuse: current flatpak-builder mounts the
          # appdir read-only during the "Cleaning up" phase (rofiles-fuse,
          # to protect hardlinked file trees); that breaks any cleanup
          # needing a writable appdir. The app manifest has no
          # cleanup-commands today, but disable it for consistency with
          # the runtime build and to keep that door closed.
          flatpak-builder --user --ccache --arch=${{ matrix.arch }} --disable-rofiles-fuse --repo=repo build manifest-patched.json
      - name: Update repo
        run: flatpak build-update-repo repo
      - name: Package combined repo (runtime + app)
        run: tar -cJf "xtp-flatpak-${{ matrix.arch }}-${{ inputs.version }}.tar.xz" repo
      - name: Upload Flatpak repo
        uses: actions/upload-artifact@v4
        with:
          name: xtp-flatpak-${{ matrix.arch }}
          path: xtp-flatpak-${{ matrix.arch }}-${{ inputs.version }}.tar.xz
          if-no-files-found: error