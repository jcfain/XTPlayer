# =============================================================================
# XTPlayer — reusable build pipeline
#
# Called by nightly.yml (Development) and release.yml (main / v* tags).
# Builds XTEngine + XTPlayer and packages four artifacts:
#
#   - Linux x86_64   AppImage  (native)
#   - Linux aarch64  AppImage  (cross-compiled from the x86_64 runner)
#   - Windows x86_64 zip       (MinGW)
#   - macOS universal DMG      (arm64 + x86_64, ad-hoc signed)
#
# Every artifact bundles a custom FFmpeg n9.0.1 with AV1 (dav1d/aom) +
# hwaccel, replacing the AV1-less FFmpeg that ships with Qt.
#
# The Angular web bundle is built once (web job) and injected into the
# XTEngine checkout, so no manually committed www bundle is ever used.
#
# Layout note: the .pro files hardcode a sibling layout
# (../../XTEngine/...), so XTEngine is checked out to ../XTEngine.
# =============================================================================
name: Build (reusable)

on:
  workflow_call:
    inputs:
      player-branch:
        description: 'XTPlayer branch to build (Development for nightly, main for release)'
        required: true
        type: string
      engine-branch:
        description: 'XTEngine branch to build against (Development or main)'
        required: true
        type: string
      version:
        description: 'Version string for artifact names (e.g. v0.6.10, nightly-20261119-abc1234)'
        required: true
        type: string

env:
  QT_VERSION: '6.12.0'
  # Pinned to the exact commit the local Qt trees were built from
  # (pumphaus/qtgamepadlegacy, dev branch).
  GAMEPADLEGACY_REF: '434fe59d70f42fa0f745af05921ba64169fce90b'
  # Addon packages installed on top of base Qt by helper_scripts/install-qt.sh.
  # NOTE: the base package does NOT ship the extra imageformats plugins
  # (webp/tiff/tga/wbmp/icns) - only gif/ico/jpeg (+svg from qtsvg) - so
  # qtimageformats is REQUIRED for webp thumbnail support (verified against
  # the download.qt.io 6.12.0 package contents). qtspeech provides
  # texttospeech, qtconnectivity provides bluetooth.
  QT_MODULES: 'qtmultimedia qtserialport qtspeech qtwebsockets qtconnectivity qthttpserver qtimageformats'

jobs:
  web:
    name: Angular web bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout XTEngine
        uses: actions/checkout@v4
        with:
          repository: jcfain/XTEngine
          ref: ${{ inputs.engine-branch }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/wwwsrc/package-lock.json
      - name: Install npm deps
        working-directory: src/wwwsrc
        run: npm ci
      - name: Build (production)
        working-directory: src/wwwsrc
        run: |
          npm run set-version
          npx ng build --configuration production
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: xtp-web
          path: src/wwwsrc/dist/xtp-web/browser
          retention-days: 1

  linux-x86_64:
    name: Linux x86_64 (AppImage)
    # Pinned: the AppImage bundles the runner's system libs (glib, mp3lame,
    # ...) but NOT glibc itself (linuxdeploy excludelist), so the AppImage
    # needs the target's glibc >= the runner's. 24.04 (glibc 2.39) keeps it
    # runnable on Debian 13 / Ubuntu 24.04+ hosts (the app + Qt 6.12 only
    # need glibc 2.34).
    runs-on: ubuntu-24.04
    needs: web
    env:
      # Absolute: build steps cd into sibling/sub dirs before invoking qmake.
      QT_DIR: ${{ github.workspace }}/qt6
      CODEC_PREFIX: ffmpeg-av1
    steps:
      - name: Checkout XTPlayer
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.player-branch }}
      - name: Clone XTEngine (sibling of the workspace, as the .pro files expect)
        run: git clone --depth 1 --branch ${{ inputs.engine-branch }} https://github.com/jcfain/XTEngine.git ../XTEngine
      - name: Restore CI-built web bundle
        uses: actions/download-artifact@v4
        with:
          name: xtp-web
          path: web-bundle
      - name: Install web bundle into XTEngine
        run: |
          rm -rf ../XTEngine/src/www
          mkdir -p ../XTEngine/src/www
          cp -r web-bundle/* ../XTEngine/src/www/
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config nasm meson \
            libgl1-mesa-dev libxkbcommon-dev libwayland-dev \
            libfontconfig1-dev libfreetype-dev libdbus-1-dev libglib2.0-dev \
            libbluetooth-dev libusb-1.0-0-dev libasound2-dev libpulse-dev \
            libx11-dev libxcb1-dev libxext-dev libxrender-dev libxi-dev \
            libxfixes-dev libxrandr-dev libxcomposite-dev libxdamage-dev \
            libxtst-dev libnss3-dev libxcb-xinerama0-dev libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xkb1 libxkbcommon-x11-0 \
            libsm6 libice6 libfuse2t64 libgssapi-krb5-2 \
            libspeechd2 \
            libpcsclite1 libcups2t64
      - name: Cache Qt
        uses: actions/cache@v4
        with:
          path: ${{ env.QT_DIR }}
          key: qt-${{ env.QT_VERSION }}-Linux-x64-${{ env.QT_MODULES }}-${{ hashFiles('helper_scripts/install-qt.sh') }}
      - name: Install Qt ${{ env.QT_VERSION }}
        env:
          QT_OS_DIR: linux_x64
          QT_ARCH: linux_gcc_64
        run: bash helper_scripts/install-qt.sh
      - name: Checkout QtGamepadLegacy
        uses: actions/checkout@v4
        with:
          repository: pumphaus/qtgamepadlegacy
          ref: ${{ env.GAMEPADLEGACY_REF }}
          path: qtgamepadlegacy
      - name: Build + install QtGamepadLegacy into the Qt tree
        run: |
          cmake -S qtgamepadlegacy -B qtgamepadlegacy/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${QT_DIR}" \
            -DCMAKE_INSTALL_PREFIX="${QT_DIR}"
          cmake --build qtgamepadlegacy/build -j"$(nproc)"
          cmake --install qtgamepadlegacy/build
          test -f "${QT_DIR}/mkspecs/modules/qt_lib_gamepadlegacy.pri" \
            && echo "QtGamepadLegacy installed into ${QT_DIR}"
      - name: Cache FFmpeg
        uses: actions/cache@v4
        with:
          path: ${{ env.CODEC_PREFIX }}
          key: ffmpeg-av1-linux-x64-2404-${{ hashFiles('helper_scripts/build-ffmpeg-av1.sh') }}
      - name: Build FFmpeg n9.0.1 (AV1 + hwaccel)
        run: bash helper_scripts/build-ffmpeg-av1.sh --reuse --install-deps

      - name: Build XTEngine
        run: |
          mkdir -p ../XTEngine/build-release
          cd ../XTEngine/build-release
          "${QT_DIR}/bin/qmake" ../src/XTEngine.pro CONFIG+=release
          make -j"$(nproc)"
      - name: Build XTPlayer
        run: |
          mkdir -p build-release
          cd build-release
          "${QT_DIR}/bin/qmake" ../src/XTPlayer.pro CONFIG+=release
          make -j"$(nproc)"
      - name: Package AppImage
        env:
          EXTRA_PLATFORM_PLUGINS: libqwayland.so
          EXTRA_QT_MODULES: waylandcompositor
        run: |
          APPDIR="${GITHUB_WORKSPACE}/dist/XTPlayer-${{ inputs.version }}-Linux-x86_64"
          rm -rf dist
          mkdir -p dist "${APPDIR}/usr/bin" "${APPDIR}/usr/lib"
          # Stage the app (same layout as lin_release_deploy-appimage.sh)
          cp build-release/release/XTPlayer "${APPDIR}/usr/bin/"
          cp -r build-release/release/www "${APPDIR}/usr/bin/"
          cp -r build-release/release/themes "${APPDIR}/usr/bin/"
          cp -r build-release/release/translations "${APPDIR}/usr/bin/"
          cp -P ../XTEngine/build-release/release/libxtengine.so* "${APPDIR}/usr/lib/"
          # Bundle the AV1 codec libs (overwrites the AV1-less Qt copies)
          cp -f "${CODEC_PREFIX}/lib"/libavcodec.so.63*    "${APPDIR}/usr/lib/"
          cp -f "${CODEC_PREFIX}/lib"/libavformat.so.63*   "${APPDIR}/usr/lib/"
          cp -f "${CODEC_PREFIX}/lib"/libavutil.so.61*     "${APPDIR}/usr/lib/"
          cp -f "${CODEC_PREFIX}/lib"/libswscale.so.10*    "${APPDIR}/usr/lib/"
          cp -f "${CODEC_PREFIX}/lib"/libswresample.so.7*  "${APPDIR}/usr/lib/"
          cp -f "${CODEC_PREFIX}/lib"/libdav1d.so.7*       "${APPDIR}/usr/lib/" 2>/dev/null || true
          cp -f "${CODEC_PREFIX}/lib"/libaom.so.3*         "${APPDIR}/usr/lib/" 2>/dev/null || true
          # Image format plugins (webp, tiff, ...): loaded at runtime via
          # QPluginLoader, so linuxdeploy never deploys them. Pre-stage the
          # full set from the Qt tree (matches what windeployqt/macdeployqt
          # bundle on the other platforms).
          mkdir -p "${APPDIR}/usr/plugins/imageformats"
          cp -f "${QT_DIR}/plugins/imageformats/"*.so "${APPDIR}/usr/plugins/imageformats/"
          # glibc compatibility guard (same as lin_release_deploy-appimage.sh)
          _codec_lib="${APPDIR}/usr/lib/$(ls "${APPDIR}/usr/lib" | grep '^libavcodec.so.63' | head -1)"
          _need_glibc="$(objdump -T "${_codec_lib}" 2>/dev/null | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sed 's/GLIBC_//' | sort -Vu | tail -1)"
          _sys_glibc="$(ldd --version 2>/dev/null | head -1 | grep -oE '[0-9]+\.[0-9]+' | head -1)"
          if [ -n "${_need_glibc}" ] && [ -n "${_sys_glibc}" ]; then
            if [ "${_need_glibc%%.*}" -gt "${_sys_glibc%%.*}" ] || \
               { [ "${_need_glibc%%.*}" -eq "${_sys_glibc%%.*}" ] && [ "${_need_glibc#*.}" -gt "${_sys_glibc#*.}" ]; }; then
              echo "ERROR: AV1 codec libs require glibc ${_need_glibc} but the runner has glibc ${_sys_glibc}."
              exit 1
            fi
            echo "OK: codec glibc requirement (${_need_glibc}) <= runner glibc (${_sys_glibc})."
          fi
          # webp is required for image thumbs (the app falls back to jpg
          # without it) - hard-fail if the Qt tree lacks the plugin.
          test -f "${APPDIR}/usr/plugins/imageformats/libqwebp.so" \
            || { echo "ERROR: libqwebp.so missing from the Qt tree"; exit 1; }
          # Diagnostics: the qt plugin resolves its Qt root from `qmake -query`;
          # print what it will see so a regression is self-explanatory.
          echo "==> qmake diagnostics"
          echo "QMAKE=${QMAKE:-<unset>}"
          "${QT_DIR}/bin/qmake" -query QT_INSTALL_PREFIX QT_INSTALL_LIBS QT_INSTALL_PLUGINS
          test -f "${QT_DIR}/plugins/platforms/libqxcb.so" \
            && echo "OK: libqxcb.so present in the Qt tree" \
            || { echo "ERROR: libqxcb.so missing from ${QT_DIR}/plugins/platforms"; exit 1; }
          # NO Qt pre-staging and NO ${QT_DIR}/lib on LD_LIBRARY_PATH: the
          # qt plugin deploys the needed Qt libs/plugins from the REAL Qt
          # tree (that's how the release scripts do it - the old ~53 MB
          # AppImages). If the Qt tree is reachable via LD_LIBRARY_PATH, the
          # linuxdeploy CORE copies the app's Qt deps into the appdir, and
          # qmake (which derives its prefix from the loaded libQt6Core) then
          # resolves to the appdir, breaking the plugin.
          # qmlimportscanner (run by the qt plugin) takes -importPath
          # appdir/usr/qml and fails if the directory doesn't exist.
          mkdir -p "${APPDIR}/usr/qml"
          ls "${QT_DIR}/libexec/qmlimportscanner" 2>/dev/null \
            && echo "OK: qmlimportscanner in ${QT_DIR}/libexec" \
            || echo "WARNING: qmlimportscanner NOT in ${QT_DIR}/libexec"
          # Extract the AppImages and run the internal binaries directly:
          # the AppImage runtime sanitizes PATH (drops ${QT_DIR}/bin), so
          # the qt plugin can't find qmlimportscanner when it runs as an
          # AppImage. The internal binaries are plain ELFs and inherit the
          # environment as-is.
          rm -rf squashfs-root
          ./linuxdeploy/x86_64/linuxdeploy-x86_64.AppImage --appimage-extract
          ./linuxdeploy/x86_64/linuxdeploy-plugin-qt-x86_64.AppImage --appimage-extract
          test -x squashfs-root/usr/bin/linuxdeploy
          test -x squashfs-root/usr/bin/linuxdeploy-plugin-qt
          # Guard: the appdir must NOT contain libQt6Core before linuxdeploy
          # runs. The app's build-time RPATH points at the Qt tree, so the
          # linuxdeploy core WILL copy the app's Qt deps into the appdir
          # during its dependency deployment - that's fine as long as the
          # appdir is NOT on LD_LIBRARY_PATH (below): the plugin's qmake then
          # loads libQt6Core from the real tree and resolves the real Qt
          # root. (If the appdir were on LD_LIBRARY_PATH, qmake's prefix
          # would become the appdir and the plugin breaks in confusing ways:
          # "Could not find Qt modules" / "Cannot deploy non-existing
          # library file .../usr/plugins/...".)
          [ ! -e "${APPDIR}/usr/lib/libQt6Core.so.6" ] || { echo "ERROR: appdir contains libQt6Core before linuxdeploy"; exit 1; }
          QMAKE="${QT_DIR}/bin/qmake" \
          # Real Qt tree + XTEngine build dir on LD_LIBRARY_PATH (NEVER the
          # appdir): the plugin's qmake derives the Qt root from the loaded
          # libQt6Core (Qt tree is first, and the XTEngine dir holds no Qt
          # libs, so it cannot shadow it), and the core's ldd needs the
          # XTEngine dir to find libxtengine.so.1 (the exe's RPATH contains
          # only the Qt tree).
          LD_LIBRARY_PATH="${QT_DIR}/lib:${GITHUB_WORKSPACE}/../XTEngine/build-release/release" \
          PATH="${QT_DIR}/bin:${GITHUB_WORKSPACE}/squashfs-root/usr/bin:${PATH}" \
          ./squashfs-root/usr/bin/linuxdeploy \
            --appdir "${APPDIR}" \
            --executable "${APPDIR}/usr/bin/XTPlayer" \
            --plugin qt \
            --output appimage \
            --icon-file src/images/icons/XTP-icon.png \
            --icon-filename XTPlayer \
            --desktop-file XTPlayer.desktop \
            --exclude-library "*libqsqlmysql*" \
            --exclude-library "*libqsqlpsql*" \
            --exclude-library "*libqsqlodbc*" \
            --exclude-library "*libqsqldb2*" \
            --exclude-library "*libqsqlibase*" \
            --exclude-library "*libqsqlfirebird*"
          mv XTPlayer-x86_64.AppImage "dist/XTPlayer-${{ inputs.version }}-Linux-x86_64.AppImage"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xtp-linux-x86_64
          path: dist/XTPlayer-${{ inputs.version }}-Linux-x86_64.AppImage


  linux-aarch64:
    name: Linux aarch64 (AppImage, cross)
    # Pinned to match the x86_64 job (the cross glibc bundled into the
    # AppImage comes from this runner's cross toolchain).
    runs-on: ubuntu-24.04
    needs: web
    env:
      QT_DIR: ${{ github.workspace }}/qt6-arm64
      CODEC_PREFIX: ffmpeg-av1-arm64
    steps:
      - name: Checkout XTPlayer
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.player-branch }}
      - name: Clone XTEngine (sibling of the workspace, as the .pro files expect)
        run: git clone --depth 1 --branch ${{ inputs.engine-branch }} https://github.com/jcfain/XTEngine.git ../XTEngine
      - name: Restore CI-built web bundle
        uses: actions/download-artifact@v4
        with:
          name: xtp-web
          path: web-bundle
      - name: Install web bundle into XTEngine
        run: |
          rm -rf ../XTEngine/src/www
          mkdir -p ../XTEngine/src/www
          cp -r web-bundle/* ../XTEngine/src/www/
      - name: Install cross toolchain + qemu
        run: |
          # arm64 is an Ubuntu "port" arch: its indices are NOT on
          # archive/security.ubuntu.com (404 -> apt-get update exits 100).
          # Replace the runner's sources with explicit per-arch ones BEFORE
          # the first install: amd64 from the main mirror, arm64 from the
          # ports mirror (same archive keyring). Runner is pinned to noble,
          # so the suite names are stable; this job uses no extra apt repos.
          sudo dpkg --add-architecture arm64
          sudo rm -f /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources
          printf '%s\n' \
            'Types: deb' \
            'URIs: http://archive.ubuntu.com/ubuntu' \
            'Suites: noble noble-updates noble-backports' \
            'Components: main restricted universe multiverse' \
            'Architectures: amd64' \
            'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' \
            '' \
            'Types: deb' \
            'URIs: http://security.ubuntu.com/ubuntu' \
            'Suites: noble-security' \
            'Components: main restricted universe multiverse' \
            'Architectures: amd64' \
            'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' \
            | sudo tee /etc/apt/sources.list.d/amd64-main.sources >/dev/null
          printf '%s\n' \
            'Types: deb' \
            'URIs: http://ports.ubuntu.com/ubuntu-ports' \
            'Suites: noble noble-updates noble-backports noble-security' \
            'Components: main restricted universe multiverse' \
            'Architectures: arm64' \
            'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' \
            | sudo tee /etc/apt/sources.list.d/arm64-ports.sources >/dev/null
          sudo apt-get update
          # linux-libc-dev:arm64 = aarch64 kernel headers (linux/videodev2.h)
          # for FFmpeg's v4l2m2m hwaccel (RK3588 rkvdec on Orange Pi targets).
          # aarch64 OpenGL dev libs (multiarch): Qt6Gui's CMake config
          # requires WrapOpenGL, which must resolve for the aarch64 target.
          # libglib2.0-0t64: the aarch64 Qt tools (qtpaths, moc, ...) run
          # under qemu and need the aarch64 runtime libs.
          # The full Qt runtime set (mirroring the x86_64 job) covers the
          # deps of the Qt libs the app actually uses (Wayland ->
          # libwayland-client, XcbQpa -> libxcb-*, Bluetooth, Pulse, ...),
          # which the linuxdeploy core deploys into the AppImage.
          # NOTE: the package list must stay on the apt-get continuation
          # lines - a # comment line after a backslash continuation
          # terminates the command and the package becomes a stray
          # "command not found".
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config nasm meson \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            qemu-user-binfmt binfmt-support linux-libc-dev:arm64 \
            libgl1-mesa-dev:arm64 libxkbcommon-dev:arm64 libwayland-dev:arm64 \
            libfontconfig1-dev:arm64 libfreetype-dev:arm64 libdbus-1-dev:arm64 libglib2.0-dev:arm64 \
            libbluetooth-dev:arm64 libusb-1.0-0-dev:arm64 libasound2-dev:arm64 libpulse-dev:arm64 \
            libx11-dev:arm64 libxcb1-dev:arm64 libxext-dev:arm64 libxrender-dev:arm64 libxi-dev:arm64 \
            libxfixes-dev:arm64 libxrandr-dev:arm64 libxcomposite-dev:arm64 libxdamage-dev:arm64 \
            libxtst-dev:arm64 libnss3-dev:arm64 libxcb-xinerama0-dev:arm64 libxcb-cursor0:arm64 \
            libxcb-icccm4:arm64 libxcb-image0:arm64 libxcb-keysyms1:arm64 libxcb-randr0:arm64 \
            libxcb-render-util0:arm64 libxcb-shape0:arm64 libxcb-xkb1:arm64 libxkbcommon-x11-0:arm64 \
            libxcb-sync1:arm64 libx11-xcb1:arm64 libegl1:arm64 libzstd1:arm64 \
            libsm6:arm64 libice6:arm64 libgssapi-krb5-2:arm64 \
            libspeechd2:arm64 \
            libpcsclite1:arm64 libcups2t64:arm64
          # qemu lets the aarch64 moc/rcc/uic (shipped with the aarch64 Qt)
          # run during the cross build.
          sudo update-binfmts --enable
          sudo update-binfmts --display || true
      - name: Cache Qt
        uses: actions/cache@v4
        with:
          path: ${{ env.QT_DIR }}
          key: qt-${{ env.QT_VERSION }}-Linux-arm64-${{ env.QT_MODULES }}-${{ hashFiles('helper_scripts/install-qt.sh') }}
      - name: Install Qt ${{ env.QT_VERSION }} (aarch64)
        env:
          QT_OS_DIR: linux_arm64
          QT_ARCH: linux_gcc_arm64
        run: bash helper_scripts/install-qt.sh
      - name: Checkout QtGamepadLegacy
        uses: actions/checkout@v4
        with:
          repository: pumphaus/qtgamepadlegacy
          ref: ${{ env.GAMEPADLEGACY_REF }}
          path: qtgamepadlegacy
      - name: Cross-build + install QtGamepadLegacy
        run: |
          cmake -S qtgamepadlegacy -B qtgamepadlegacy/build \
            -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${QT_DIR}" \
            -DQT_HOST_PATH="${QT_DIR}" \
            -DCMAKE_INSTALL_PREFIX="${QT_DIR}"
          cmake --build qtgamepadlegacy/build -j"$(nproc)"
          cmake --install qtgamepadlegacy/build
          test -f "${QT_DIR}/mkspecs/modules/qt_lib_gamepadlegacy.pri" \
            && echo "QtGamepadLegacy (aarch64) installed into ${QT_DIR}"
      - name: Cache FFmpeg
        uses: actions/cache@v4
        with:
          path: ${{ env.CODEC_PREFIX }}
          key: ffmpeg-av1-linux-arm64-2404-${{ hashFiles('helper_scripts/build-ffmpeg-av1-aarch64.sh') }}
      - name: Build FFmpeg n9.0.1 (aarch64 cross, AV1)
        run: bash helper_scripts/build-ffmpeg-av1-aarch64.sh --reuse

      - name: Cross-build XTEngine
        run: |
          mkdir -p ../XTEngine/build-release
          cd ../XTEngine/build-release
          "${QT_DIR}/bin/qmake" \
            QMAKE_CC=aarch64-linux-gnu-gcc \
            QMAKE_CXX=aarch64-linux-gnu-g++ \
            QMAKE_LINK=aarch64-linux-gnu-g++ \
            QMAKE_LINK_SHLIB=aarch64-linux-gnu-g++ \
            ../src/XTEngine.pro CONFIG+=release
          make -j"$(nproc)"
      - name: Cross-build XTPlayer
        run: |
          mkdir -p build-release
          cd build-release
          "${QT_DIR}/bin/qmake" \
            QMAKE_CC=aarch64-linux-gnu-gcc \
            QMAKE_CXX=aarch64-linux-gnu-g++ \
            QMAKE_LINK=aarch64-linux-gnu-g++ \
            QMAKE_LINK_SHLIB=aarch64-linux-gnu-g++ \
            ../src/XTPlayer.pro CONFIG+=release
          make -j"$(nproc)"
      - name: Package AppImage (cross)
        env:
          EXTRA_PLATFORM_PLUGINS: libqwayland.so
          EXTRA_QT_MODULES: waylandcompositor
        run: |
          APPDIR="${GITHUB_WORKSPACE}/dist/XTPlayer-${{ inputs.version }}-Linux-aarch64"
          rm -rf dist
          mkdir -p dist "${APPDIR}/usr/bin" "${APPDIR}/usr/lib"
          cp build-release/release/XTPlayer "${APPDIR}/usr/bin/"
          cp -r build-release/release/www "${APPDIR}/usr/bin/"
          cp -r build-release/release/themes "${APPDIR}/usr/bin/"
          cp -r build-release/release/translations "${APPDIR}/usr/bin/"
          cp -P ../XTEngine/build-release/release/libxtengine.so* "${APPDIR}/usr/lib/"
          cp -f "${CODEC_PREFIX}/lib"/libavcodec.so.63*    "${APPDIR}/usr/lib/"
          cp -f "${CODEC_PREFIX}/lib"/libavformat.so.63*   "${APPDIR}/usr/lib/"
          cp -f "${CODEC_PREFIX}/lib"/libavutil.so.61*     "${APPDIR}/usr/lib/"
          cp -f "${CODEC_PREFIX}/lib"/libswscale.so.10*    "${APPDIR}/usr/lib/"
          cp -f "${CODEC_PREFIX}/lib"/libswresample.so.7*  "${APPDIR}/usr/lib/"
          cp -f "${CODEC_PREFIX}/lib"/libdav1d.so.7*       "${APPDIR}/usr/lib/" 2>/dev/null || true
          cp -f "${CODEC_PREFIX}/lib"/libaom.so.3*         "${APPDIR}/usr/lib/" 2>/dev/null || true
          # Image format plugins (webp, tiff, ...): loaded at runtime via
          # QPluginLoader, so linuxdeploy never deploys them. Pre-stage the
          # full set from the Qt tree (matches what windeployqt/macdeployqt
          # bundle on the other platforms).
          mkdir -p "${APPDIR}/usr/plugins/imageformats"
          cp -f "${QT_DIR}/plugins/imageformats/"*.so "${APPDIR}/usr/plugins/imageformats/"
          # (The Qt dep closure is staged below - the host ldd can't trace
          # aarch64 deps, so the qt plugin needs the libs present by
          # filename; plugins/QML/translations still come from the REAL
          # Qt tree.)
          echo "==> qmake diagnostics"
          echo "QMAKE=${QMAKE:-<unset>}"
          "${QT_DIR}/bin/qmake" -query QT_INSTALL_PREFIX QT_INSTALL_LIBS QT_INSTALL_PLUGINS
          test -f "${QT_DIR}/plugins/platforms/libqxcb.so" \
            && echo "OK: libqxcb.so present in the Qt tree" \
            || { echo "ERROR: libqxcb.so missing from ${QT_DIR}/plugins/platforms"; exit 1; }
          # qmlimportscanner's -importPath directory must exist.
          mkdir -p "${APPDIR}/usr/qml"
          # Cross-package with the TARGET-ARCH (aarch64) linuxdeploy binary:
          # it produces an AppImage with the aarch64 runtime, so the result
          # actually runs on aarch64. (linuxdeploy has no --cross-compile
          # mode; this is how the release scripts do it.)
          #
          # It MUST be invoked via qemu-aarch64 explicitly: the AppImageKit
          # v2 stub stamps an "AI" marker into the ELF header (offset 8),
          # which breaks the binfmt_misc magic pattern, so the kernel does
          # NOT route it to qemu (plain exec fails with "Exec format
          # error"). qemu-aarch64 reads the ELF itself and works fine.
          chmod +x linuxdeploy/aarch64/linuxdeploy-aarch64.AppImage linuxdeploy/aarch64/linuxdeploy-plugin-qt-aarch64.AppImage
          # The AppImage runtime dlopens libfuse.so.2, which does not exist
          # for aarch64 under qemu, and this runtime build has no
          # auto-extract fallback. So extract the payloads and run the
          # internal binaries directly (statically linked, plain aarch64
          # ELFs - no "AI" marker, no FUSE).
          rm -rf squashfs-root
          qemu-aarch64 ./linuxdeploy/aarch64/linuxdeploy-aarch64.AppImage --appimage-extract
          # The qt plugin extracts into the same tree; the core finds it in
          # its own directory (plugin search checks the exe dir first).
          qemu-aarch64 ./linuxdeploy/aarch64/linuxdeploy-plugin-qt-aarch64.AppImage --appimage-extract
          test -x squashfs-root/usr/bin/linuxdeploy
          test -x squashfs-root/usr/bin/linuxdeploy-plugin-qt
          # The host's ldd (used by the linuxdeploy core AND the qt plugin's
          # dependency tracing) cannot parse aarch64 ELFs - it reports
          # "not a dynamic executable" for every file, so neither can
          # discover the app's Qt dependencies. Stage the app's full Qt
          # dependency closure (readelf works cross-arch) into the appdir:
          # the qt plugin discovers modules BY FILENAME from appdir/usr/lib
          # and deploys the plugins/QML/translations from the REAL Qt tree.
          # (This is exactly what the core's ldd deployment copies on
          # x86_64 - no size impact on the final AppImage.)
          _qt_deps=$(readelf -d build-release/release/XTPlayer | grep -oE 'libQt6[A-Za-z0-9]+\.so\.6' | sort -u)
          _qt_all=""
          while :; do
            _new=""
            for _l in $_qt_deps; do
              case " $_qt_all " in *" $_l "*) continue ;; esac
              _qt_all="$_qt_all $_l"
              _new="$_new $(readelf -d "${QT_DIR}/lib/$_l" 2>/dev/null | grep -oE 'libQt6[A-Za-z0-9]+\.so\.6')"
            done
            [ -z "$_new" ] && break
            _qt_deps=$(echo "$_new" | tr ' ' '\n' | grep -v '^$' | sort -u)
          done
          for _l in $_qt_all; do
            cp -f "${QT_DIR}/lib/$_l" "${APPDIR}/usr/lib/"
          done
          echo "Staged Qt dep closure: $_qt_all"
          # ICU (libQt6Core's NEEDED) + the wayland client lib (libqwayland
          # platform plugin's NEEDED) ship in the Qt tree.
          cp -af "${QT_DIR}/lib"/libicu{data,uc,i18n}.so.* "${APPDIR}/usr/lib/"
          cp -f "${QT_DIR}/lib/libQt6WaylandClient.so.6" "${APPDIR}/usr/lib/"
          # Non-Qt deps of the staged Qt libs + platform plugins: the core's
          # ldd can't trace aarch64 files, so copy them from the arm64 debs
          # installed by the toolchain step (same set the x86_64 core
          # resolves via ldd). glibc libs come from the cross toolchain.
          for _lib in \
            libdbus-1.so.3 libglib-2.0.so.0 libgthread-2.0.so.0 \
            libfontconfig.so.1 libfreetype.so.6 libbrotlicommon.so.1 \
            libbrotlidec.so.1 libz.so.1 libzstd.so.1 \
            libGL.so.1 libEGL.so.1 \
            libpulse.so.0 libasound.so.2 libbluetooth.so.3 \
            libnss3.so libgssapi_krb5.so.2 \
            libspeechd.so.2 \
            libwayland-client.so.0 libwayland-cursor.so.0 \
            libxkbcommon.so.0 libxkbcommon-x11.so.0 \
            libxcb.so.1 libxcb-cursor.so.0 libxcb-icccm.so.4 \
            libxcb-util.so.1 libxcb-image.so.0 libxcb-keysyms.so.1 \
            libxcb-randr.so.0 libxcb-render.so.0 \
            libxcb-render-util.so.0 libxcb-shape.so.0 libxcb-shm.so.0 \
            libxcb-sync.so.1 libxcb-xfixes.so.0 libxcb-xkb.so.1 \
            libX11.so.6 libX11-xcb.so.1; do
            cp -af "/usr/lib/aarch64-linux-gnu/${_lib}"* "${APPDIR}/usr/lib/" 2>/dev/null \
              || { echo "ERROR: ${_lib} missing from /usr/lib/aarch64-linux-gnu"; exit 1; }
          done
          for _lib in libc.so.6 libm.so.6 libresolv.so.2 libstdc++.so.6 libgcc_s.so.1; do
            cp -f "/usr/aarch64-linux-gnu/lib/${_lib}"* "${APPDIR}/usr/lib/" 2>/dev/null \
              || { echo "ERROR: ${_lib} missing from /usr/aarch64-linux-gnu/lib"; exit 1; }
          done
          echo "appdir/usr/lib: $(ls "${APPDIR}/usr/lib" | wc -l) files"
          QMAKE="${QT_DIR}/bin/qmake" \
          # ONLY the real Qt tree on LD_LIBRARY_PATH (never the appdir) -
          # same reason as the x86_64 job.
          LD_LIBRARY_PATH="${QT_DIR}/lib" \
          # ${QT_DIR}/bin: the qt plugin needs qmlimportscanner (and other
          # Qt tools) on PATH; it's an aarch64 ELF that runs via binfmt.
          PATH="${QT_DIR}/bin:${GITHUB_WORKSPACE}/squashfs-root/usr/bin:${PATH}" \
          qemu-aarch64 ./squashfs-root/usr/bin/linuxdeploy \
            --appdir "${APPDIR}" \
            --executable "${APPDIR}/usr/bin/XTPlayer" \
            --plugin qt \
            --output appimage \
            --icon-file src/images/icons/XTP-icon.png \
            --icon-filename XTPlayer \
            --desktop-file XTPlayer.desktop \
            --exclude-library "*libqsqlmysql*" \
            --exclude-library "*libqsqlpsql*" \
            --exclude-library "*libqsqlodbc*" \
            --exclude-library "*libqsqldb2*" \
            --exclude-library "*libqsqlibase*" \
            --exclude-library "*libqsqlfirebird*"
          mv XTPlayer-aarch64*.AppImage "dist/XTPlayer-${{ inputs.version }}-Linux-aarch64.AppImage"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xtp-linux-aarch64
          path: dist/XTPlayer-${{ inputs.version }}-Linux-aarch64.AppImage


  windows:
    name: Windows x86_64 (zip)
    runs-on: windows-latest
    needs: web
    defaults:
      run:
        shell: bash
    env:
      QT_DIR: ${{ github.workspace }}/qt6
      # Absolute: CMake rejects relative compiler paths.
      MINGW_PREFIX: ${{ github.workspace }}/qt6/Tools/mingw1510_64
      CODEC_PREFIX: ffmpeg-av1-win
    steps:
      - name: Checkout XTPlayer
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.player-branch }}
      - name: Clone XTEngine (sibling of the workspace, as the .pro files expect)
        run: git clone --depth 1 --branch ${{ inputs.engine-branch }} https://github.com/jcfain/XTEngine.git ../XTEngine
      - name: Restore CI-built web bundle
        uses: actions/download-artifact@v4
        with:
          name: xtp-web
          path: web-bundle
      - name: Install web bundle into XTEngine
        run: |
          rm -rf ../XTEngine/src/www
          mkdir -p ../XTEngine/src/www
          cp -r web-bundle/* ../XTEngine/src/www/
      - name: Cache Qt
        uses: actions/cache@v4
        with:
          path: ${{ env.QT_DIR }}
          key: qt-${{ env.QT_VERSION }}-Windows-${{ env.QT_MODULES }}-${{ hashFiles('helper_scripts/install-qt.sh') }}
      - name: Install Qt ${{ env.QT_VERSION }} (MinGW)
        env:
          QT_OS_DIR: windows_x86
          QT_ARCH: win64_mingw
          QT_TOOLS: mingw1510
        run: bash helper_scripts/install-qt.sh
      - name: Install FFmpeg build tools
        run: |
          choco install nasm -y
          pip install meson ninja
          # pkg-config for FFmpeg's configure (it looks for a
          # cross-prefixed copy; the build script places one).
          # binutils: the mingw32 target path needs dlltool (import lib
          # from .def); the build script copies it from here.
          C:/msys64/usr/bin/pacman.exe -Sy --noconfirm mingw-w64-x86_64-pkg-config mingw-w64-x86_64-binutils
      - name: Checkout QtGamepadLegacy
        uses: actions/checkout@v4
        with:
          repository: pumphaus/qtgamepadlegacy
          ref: ${{ env.GAMEPADLEGACY_REF }}
          path: qtgamepadlegacy
      - name: Build + install QtGamepadLegacy into the Qt tree
        run: |
          export PATH="$MINGW_PREFIX/bin:$QT_DIR/bin:$PATH"
          cmake -S qtgamepadlegacy -B qtgamepadlegacy/build -G "MinGW Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="$MINGW_PREFIX/bin/x86_64-w64-mingw32-gcc.exe" \
            -DCMAKE_CXX_COMPILER="$MINGW_PREFIX/bin/x86_64-w64-mingw32-g++.exe" \
            -DCMAKE_PREFIX_PATH="$QT_DIR" \
            -DCMAKE_INSTALL_PREFIX="$QT_DIR"
          cmake --build qtgamepadlegacy/build -j
          cmake --install qtgamepadlegacy/build
          test -f "$QT_DIR/mkspecs/modules/qt_lib_gamepadlegacy.pri" \
            && echo "QtGamepadLegacy installed into $QT_DIR"
      - name: Cache FFmpeg
        uses: actions/cache@v4
        with:
          path: ${{ env.CODEC_PREFIX }}
          key: ffmpeg-av1-win64-${{ hashFiles('helper_scripts/build-ffmpeg-av1-win.sh') }}
      - name: Build FFmpeg n9.0.1 (Win, AV1)
        run: bash helper_scripts/build-ffmpeg-av1-win.sh --reuse

      - name: Build XTEngine
        run: |
          export PATH="$QT_DIR/bin:$MINGW_PREFIX/bin:$PATH"
          mkdir -p ../XTEngine/build-release
          cd ../XTEngine/build-release
          qmake ../src/XTEngine.pro CONFIG+=release
          mingw32-make -j
          # mingw32-make -j on Windows can exit 0 with the DLL target's
          # recipe scheduled twice (qmake/MinGW parallel race): the recipe
          # starts with `rm -f <outputs>`, so a delayed second run deletes
          # the first run's artifacts - sometimes AFTER make returned.
          # Settle first (up to 2 min) so an in-flight second link can
          # recreate them, then verify and repair. (qmake names the import
          # lib libxtengine.a for this target - accept the .dll.a form too.)
          for i in $(seq 1 12); do
            test -f release/xtengine.dll && break
            sleep 10
          done
          engine_artifacts_ok() {
            test -f release/xtengine.dll && { test -f release/libxtengine.a || test -f release/libxtengine.dll.a; }
          }
          if ! engine_artifacts_ok; then
            echo "WARNING: XTEngine artifacts missing after parallel make - serial make-up pass"
            mingw32-make
          fi
          # A serial pass cannot repair a race-corrupted build state (make
          # believes the DLL target is up to date and skips the link). If the
          # artifacts are STILL missing, nuke the build dir and rebuild
          # serially from scratch - deterministic, no race.
          if ! engine_artifacts_ok; then
            echo "WARNING: XTEngine artifacts still missing after serial pass - clean serial rebuild"
            cd ..
            rm -rf build-release
            mkdir build-release
            cd build-release
            qmake ../src/XTEngine.pro CONFIG+=release
            mingw32-make
          fi
          # Final re-verify after a short settle: a delayed second recipe
          # run can strike between the checks above and this test.
          sleep 15
          if ! engine_artifacts_ok; then
            echo "WARNING: XTEngine artifacts vanished after verification - final clean serial rebuild"
            cd ..
            rm -rf build-release
            mkdir build-release
            cd build-release
            qmake ../src/XTEngine.pro CONFIG+=release
            mingw32-make
          fi
          engine_artifacts_ok \
            || { echo "ERROR: XTEngine build produced no DLL/import lib:"; ls -la release/; exit 1; }
      - name: Build XTPlayer
        run: |
          export PATH="$QT_DIR/bin:$MINGW_PREFIX/bin:$PATH"
          # Fail early with a clear diagnostic if the engine import lib is
          # missing (the link error for it is otherwise cryptic).
          { test -f ../XTEngine/build-release/release/libxtengine.a || test -f ../XTEngine/build-release/release/libxtengine.dll.a; } \
            || { echo "ERROR: XTEngine import library missing:"; ls -la ../XTEngine/build-release/release/; exit 1; }
          mkdir -p build-release
          cd build-release
          qmake ../src/XTPlayer.pro CONFIG+=release
          mingw32-make -j
          # Same parallel race as the engine build (the exe recipe can be
          # scheduled twice; the second run's leading `rm -f` deletes the
          # first run's output). Settle, verify, repair.
          for i in $(seq 1 12); do
            test -f release/XTPlayer.exe && break
            sleep 10
          done
          player_exe_ok() { test -f release/XTPlayer.exe; }
          if ! player_exe_ok; then
            echo "WARNING: XTPlayer.exe missing after parallel make - serial make-up pass"
            mingw32-make
          fi
          if ! player_exe_ok; then
            echo "WARNING: XTPlayer.exe still missing after serial pass - clean serial rebuild"
            cd ..
            rm -rf build-release
            mkdir build-release
            cd build-release
            qmake ../src/XTPlayer.pro CONFIG+=release
            mingw32-make
          fi
          sleep 15
          if ! player_exe_ok; then
            echo "WARNING: XTPlayer.exe vanished after verification - final clean serial rebuild"
            cd ..
            rm -rf build-release
            mkdir build-release
            cd build-release
            qmake ../src/XTPlayer.pro CONFIG+=release
            mingw32-make
          fi
          player_exe_ok \
            || { echo "ERROR: XTPlayer build produced no exe:"; ls -la release/; exit 1; }
      - name: Package zip
        run: |
          export PATH="$QT_DIR/bin:$MINGW_PREFIX/bin:$PATH"
          STAGING="${GITHUB_WORKSPACE}/dist/staging"
          rm -rf dist
          mkdir -p dist
          # App + engine lib + www/themes/translations (qmake copydata staged them)
          cp -r build-release/release/. "$STAGING/"
          cp ../XTEngine/build-release/release/XTEngine.dll "$STAGING/"
          # Qt DLLs + plugins (same as win_release_deploy-release.bat)
          "$QT_DIR/bin/windeployqt.exe" --dir "$STAGING" "$STAGING/XTPlayer.exe"
          "$QT_DIR/bin/windeployqt.exe" --dir "$STAGING" "$STAGING/XTEngine.dll"
          # Extras (same set as win_release_deploy-release.bat)
          cp ../XTEngine/src/rename_me_for_local_settings.ini "$STAGING/"
          cp XTP_and_VR_guide.pdf "$STAGING/"
          cp src/README.txt "$STAGING/"
          cp src/XTPlayerDebug.bat src/XTPlayerVerbose.bat "$STAGING/"
          # AV1 codec DLLs (drop-in next to the exe)
          cp "$CODEC_PREFIX/bin/avcodec-63.dll" "$CODEC_PREFIX/bin/avformat-63.dll" \
             "$CODEC_PREFIX/bin/avutil-61.dll" "$CODEC_PREFIX/bin/swscale-10.dll" \
             "$CODEC_PREFIX/bin/swresample-7.dll" "$STAGING/"
          # meson (gcc cross) names the DLL libdav1d.dll in bin/ (the import
          # lib in lib/ embeds that name, so avcodec-63.dll imports
          # "libdav1d.dll" - it must keep the lib prefix); CMake (aom)
          # installs aom.dll into bin/ too.
          if [ -f "$CODEC_PREFIX/bin/libdav1d.dll" ]; then
            cp "$CODEC_PREFIX/bin/libdav1d.dll" "$STAGING/"
          else
            cp "$CODEC_PREFIX/bin/dav1d.dll" "$STAGING/"
          fi
          [ -f "$CODEC_PREFIX/bin/aom.dll" ] && cp "$CODEC_PREFIX/bin/aom.dll" "$STAGING/" || true
          # Zip with contents at the zip root (like the 7z releases)
          cd "$STAGING"
          tar.exe -a -cf "../XTPlayer-${{ inputs.version }}_Win_x86_64.zip" *
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xtp-windows
          path: dist/XTPlayer-${{ inputs.version }}_Win_x86_64.zip


  macos:
    name: macOS universal (DMG)
    runs-on: macos-latest
    needs: web
    env:
      QT_DIR: ${{ github.workspace }}/qt6
      CODEC_PREFIX: ffmpeg-av1-mac
      # Oldest macOS Qt 6.12 supports (its official binaries target 11.0).
      # The deployment target is a MINIMUM, not a maximum: the app runs on
      # 11..26 and gets all newer-OS features at runtime (VideoToolbox AV1
      # hwaccel, Metal, ...). The native code calls no Apple APIs directly,
      # so nothing needs availability guards. Picked up by qmake, CMake and
      # clang for every component (app, engine, FFmpeg, QtGamepadLegacy).
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - name: Checkout XTPlayer
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.player-branch }}
      - name: Clone XTEngine (sibling of the workspace, as the .pro files expect)
        run: git clone --depth 1 --branch ${{ inputs.engine-branch }} https://github.com/jcfain/XTEngine.git ../XTEngine
      - name: Restore CI-built web bundle
        uses: actions/download-artifact@v4
        with:
          name: xtp-web
          path: web-bundle
      - name: Install web bundle into XTEngine
        run: |
          rm -rf ../XTEngine/src/www
          mkdir -p ../XTEngine/src/www
          cp -r web-bundle/* ../XTEngine/src/www/
      - name: Install build tools
        run: brew install --quiet nasm meson ninja
      - name: Cache Qt
        uses: actions/cache@v4
        with:
          path: ${{ env.QT_DIR }}
          key: qt-${{ env.QT_VERSION }}-macOS-${{ env.QT_MODULES }}-${{ hashFiles('helper_scripts/install-qt.sh') }}
      - name: Install Qt ${{ env.QT_VERSION }}
        env:
          QT_OS_DIR: mac_x64
          QT_ARCH: clang_64
        run: bash helper_scripts/install-qt.sh
      - name: Checkout QtGamepadLegacy
        uses: actions/checkout@v4
        with:
          repository: pumphaus/qtgamepadlegacy
          ref: ${{ env.GAMEPADLEGACY_REF }}
          path: qtgamepadlegacy
      - name: Build + install QtGamepadLegacy (universal)
        run: |
          cmake -S qtgamepadlegacy -B qtgamepadlegacy/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_PREFIX_PATH="$QT_DIR" \
            -DCMAKE_INSTALL_PREFIX="$QT_DIR"
          cmake --build qtgamepadlegacy/build -j"$(sysctl -n hw.ncpu)"
          cmake --install qtgamepadlegacy/build
          test -f "$QT_DIR/mkspecs/modules/qt_lib_gamepadlegacy.pri" \
            && echo "QtGamepadLegacy installed into $QT_DIR"
      - name: Cache FFmpeg
        uses: actions/cache@v4
        with:
          path: ${{ env.CODEC_PREFIX }}
          key: ffmpeg-av1-mac-110-${{ hashFiles('helper_scripts/build-ffmpeg-av1-mac.sh') }}
      - name: Build FFmpeg n9.0.1 (universal, AV1)
        run: bash helper_scripts/build-ffmpeg-av1-mac.sh --reuse

      - name: Build XTEngine (universal)
        run: |
          mkdir -p ../XTEngine/build-release
          cd ../XTEngine/build-release
          "${QT_DIR}/bin/qmake" ../src/XTEngine.pro CONFIG+=release
          make -j"$(sysctl -n hw.ncpu)"
      - name: Build XTPlayer (universal)
        run: |
          mkdir -p build-release
          cd build-release
          "${QT_DIR}/bin/qmake" ../src/XTPlayer.pro CONFIG+=release
          make -j"$(sysctl -n hw.ncpu)"
      - name: Package DMG
        run: |
          APP="build-release/release/XTPlayer.app"
          # macdeployqt FIRST: it deploys the Qt frameworks + plugins and the
          # FFmpeg dylibs the Qt FFmpeg plugin references (the AV1-less copies
          # from the Qt tree). Our AV1 build replaces those copies afterwards
          # (same file names), so it must go in AFTER macdeployqt - staging it
          # before would let macdeployqt overwrite it with the Qt copies.
          # The executable's rpath list only contains the Qt lib dir (qmake
          # doesn't add the bundle's Frameworks dir); add it so macdeployqt
          # can resolve @rpath references into the bundle.
          install_name_tool -add_rpath "@executable_path/../Frameworks" \
            "$APP/Contents/MacOS/XTPlayer" 2>/dev/null || true
          # macdeployqt reports (non-fatal) errors for deps it cannot
          # resolve: the libxtengine reference is fixed by install_name_tool
          # below. Don't let it fail the step.
          "${QT_DIR}/bin/macdeployqt" "$APP" \
            || echo "WARNING: macdeployqt reported unresolvable deps (expected, fixed below)"
          # AV1 codec dylibs (drop-in replacement for the Qt FFmpeg copies
          # macdeployqt just deployed - same file names). Their install names
          # are @rpath/... (normalized by build-ffmpeg-av1-mac.sh), resolved
          # at runtime via the executable's @executable_path/../Frameworks
          # rpath that macdeployqt adds.
          mkdir -p "$APP/Contents/Frameworks"
          cp "$CODEC_PREFIX/lib/libavcodec.63.dylib"   "$APP/Contents/Frameworks/"
          cp "$CODEC_PREFIX/lib/libavformat.63.dylib"  "$APP/Contents/Frameworks/"
          cp "$CODEC_PREFIX/lib/libavutil.61.dylib"    "$APP/Contents/Frameworks/"
          cp "$CODEC_PREFIX/lib/libswscale.10.dylib"   "$APP/Contents/Frameworks/"
          cp "$CODEC_PREFIX/lib/libswresample.7.dylib" "$APP/Contents/Frameworks/"
          cp "$CODEC_PREFIX/lib/libdav1d.dylib"      "$APP/Contents/Frameworks/"
          cp "$CODEC_PREFIX/lib/libaom.dylib"        "$APP/Contents/Frameworks/"
          # aom's CMake install only creates libaom.dylib, but FFmpeg
          # references @rpath/libaom.3.dylib - provide the versioned name.
          ln -sf libaom.dylib "$APP/Contents/Frameworks/libaom.3.dylib"
          # dav1d (meson) names the file libdav1d.dylib but its install name
          # is @rpath/libdav1d.7.dylib - provide the versioned name too.
          ln -sf libdav1d.dylib "$APP/Contents/Frameworks/libdav1d.7.dylib"
          # App data (same set as mac_release_deploy.sh)
          cp -R src/themes "$APP/Contents/MacOS/"
          cp -R src/images "$APP/Contents/MacOS/"
          cp -R src/translations "$APP/Contents/MacOS/"
          cp -R build-release/release/www "$APP/Contents/MacOS/"
          # Engine dylib (same as mac_release_deploy.sh)
          cp ../XTEngine/build-release/release/libxtengine*.dylib "$APP/Contents/Frameworks/"
          # The engine's own install name comes from qmake's install path
          # (e.g. /usr/lib/libxtengine.1.0.0.dylib) - normalize it to @rpath,
          # and give the engine an rpath so its @rpath references to the
          # FFmpeg dylibs resolve inside the bundle (macdeployqt never sees
          # the engine: it is copied AFTER macdeployqt ran).
          install_name_tool -id "@rpath/libxtengine.1.0.0.dylib" \
            "$APP/Contents/Frameworks/libxtengine.1.0.0.dylib"
          install_name_tool -add_rpath "@executable_path/../Frameworks" \
            "$APP/Contents/Frameworks/libxtengine.1.0.0.dylib" 2>/dev/null || true
          # Rewrite the executable's reference to the engine. The recorded
          # name depends on how qmake stamped the dylib (@rpath/libxtengine.1.dylib,
          # an absolute install path, or a bare name) - detect any form
          # instead of hardcoding.
          OLD_ENGINE_REF=$(otool -L "$APP/Contents/MacOS/XTPlayer" \
            | awk '/libxtengine.*\.dylib/ && $1 !~ /Frameworks/ {print $1; exit}')
          if [ -n "$OLD_ENGINE_REF" ]; then
            install_name_tool -change "$OLD_ENGINE_REF" \
              "@executable_path/../Frameworks/libxtengine.1.0.0.dylib" \
              "$APP/Contents/MacOS/XTPlayer"
          fi
          # Ad-hoc signing (no Apple Developer ID needed). Innermost first.
          # codesign treats EVERY file under Contents/MacOS/ as a code
          # object, so the resources copied there (images, themes, www,
          # translations) must be signed too, or `codesign --verify --deep`
          # fails with "code object is not signed at all".
          find "$APP/Contents/MacOS" -type f -exec codesign --force --sign - {} \;
          find "$APP" -depth -type f -name "*.dylib" -exec codesign --force --sign - {} \;
          find "$APP" -depth -type d -name "*.framework" -exec codesign --force --sign - {} \;
          codesign --force --sign - "$APP"
          codesign --verify --deep "$APP" && echo "Signature OK (ad-hoc)"
          # DMG
          rm -rf dist
          mkdir -p dist/app
          cp -R "$APP" dist/app/
          hdiutil create -volname "XTPlayer-${{ inputs.version }}" \
            -srcfolder dist/app -ov -format UDZO \
            "dist/XTPlayer-${{ inputs.version }}_MacOS_universal.dmg"
      - name: Verify bundle links
        run: |
          APP="build-release/release/XTPlayer.app"
          # Gate the artifact on its final link state (the otool checks that
          # used to be a manual post-build checklist):
          #  - no build-machine absolute paths in the app + engine
          #  - the executable references the engine via @executable_path
          #  - every bundled dylib has an @rpath install name
          otool -L "$APP/Contents/MacOS/XTPlayer"
          otool -L "$APP/Contents/Frameworks/libxtengine.1.0.0.dylib"
          BAD=$(otool -L "$APP/Contents/MacOS/XTPlayer" \
                  "$APP/Contents/Frameworks/libxtengine.1.0.0.dylib" \
                | grep -E '/Users/runner|/usr/lib/libxtengine' || true)
          if [ -n "$BAD" ]; then
            echo "ERROR: absolute build paths remain in the bundle:"
            echo "$BAD"
            exit 1
          fi
          otool -L "$APP/Contents/MacOS/XTPlayer" \
            | grep -q '@executable_path/../Frameworks/libxtengine' \
            || { echo "ERROR: executable does not reference the engine via @executable_path"; exit 1; }
          for f in "$APP/Contents/Frameworks/"*.dylib; do
            ID=$(otool -D "$f" | tail -1)
            case "$ID" in
              @rpath/*) ;;
              *) echo "ERROR: $(basename "$f") has non-rpath install name: $ID"; exit 1 ;;
            esac
          done
          echo "Bundle links OK"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xtp-macos
          path: dist/XTPlayer-${{ inputs.version }}_MacOS_universal.dmg

