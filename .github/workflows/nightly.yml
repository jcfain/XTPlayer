# =============================================================================
# XTPlayer — nightly builds
#
# Builds XTPlayer (Development) against XTEngine (Development) daily at
# 02:00 UTC and on demand ("Run workflow" button), then publishes the
# artifacts to the rolling 'nightly' GitHub Release (assets replaced each
# run).
#
# NOTE: GitHub only fires `schedule` events for workflows on the DEFAULT
# branch, so this file must exist on main as well as Development. The
# branch being BUILT is always Development (see engine-branch + the
# checkout in build.yml, which checks out the calling ref).
# =============================================================================
name: Nightly

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch: {}

jobs:
  meta:
    name: Release name
    runs-on: ubuntu-latest
    outputs:
      release-name: ${{ steps.v.outputs.release_name }}
      built-sha: ${{ steps.v.outputs.built_sha }}
    steps:
      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The build checks out Development, so the provenance SHA must be
          # Development's HEAD - NOT github.sha, which for schedule +
          # workflow_dispatch runs is the default-branch (main) HEAD: a commit
          # that was never built. Using it made the release name name a main
          # commit instead of the Development commit that produced the binaries.
          sha=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/branches/Development" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["commit"]["sha"])')
          echo "built_sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "release_name=Nightly $(date -u +%Y-%m-%d) — ${sha}" >> "$GITHUB_OUTPUT"

  web:
    name: Angular web bundle (shared)
    runs-on: ubuntu-24.04
    steps:
      # Built ONCE here and shared by both build.yml and flatpak.yml (which
      # pass web-bundle-artifact: xtp-web to skip their own local build).
      - name: Checkout XTEngine
        uses: actions/checkout@v4
        with:
          repository: jcfain/XTEngine
          ref: Development
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/wwwsrc/package-lock.json
      - name: Install npm deps
        working-directory: src/wwwsrc
        run: npm ci
      - name: Build (production)
        working-directory: src/wwwsrc
        run: |
          npm run set-version
          npx ng build --configuration production
      - name: Package bundle
        run: tar -cJf xtp-web.tar.xz -C src/wwwsrc/dist/xtp-web/browser .
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: xtp-web
          path: xtp-web.tar.xz
          retention-days: 1

  build:
    name: Build all platforms
    needs: [meta, web]
    uses: ./.github/workflows/build.yml
    with:
      player-branch: Development
      engine-branch: Development
      # Fixed 'nightly' in the file names so overwrite_files replaces the
      # previous run's assets; the date/commit live in the release name.
      version: nightly
      web-bundle-artifact: xtp-web

  flatpak:
    name: Build Flatpak
    needs: web
    uses: ./.github/workflows/flatpak.yml
    with:
      player-branch: Development
      engine-branch: Development
      version: nightly
      web-bundle-artifact: xtp-web

  publish:
    name: Publish nightly release
    needs: [build, flatpak, meta]
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Flatten artifacts
        run: |
          rm -rf dist/xtp-web   # internal web-bundle artifact, not a release asset
          find dist -type f -exec mv {} dist/ \;
      - name: Publish to rolling 'nightly' release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: ${{ needs.meta.outputs.release-name }}
          body: |
            Nightly build of **Development** (XTEngine **Development**) — commit ${{ needs.meta.outputs.built-sha }}

            Artifacts:
            * Linux x86_64 + aarch64 AppImages
            * Windows x86_64 zip
            * macOS universal (arm64 + x86_64) DMG
            * Flatpak bundles x86_64 + aarch64 (self-contained; base pulled from Flathub)

            > **macOS:** the DMG is ad-hoc signed (no Apple Developer account).
            > First launch: right-click the app → **Open** (or
            > `xattr -d com.apple.quarantine /Applications/XTPlayer.app`).
          files: |
            dist/*
      - name: Refresh source archives (move nightly tag to the built commit)
        # GitHub's auto-generated "Source code (zip/tar.gz)" are built from the
        # commit the 'nightly' TAG points to, which stays frozen at the commit
        # the release was first created on. Re-uploading assets / updating the
        # release name never moves the tag, so the source archives go stale.
        # Move the tag to the HEAD of the branch we just built so the source
        # archives match the binaries.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_BRANCH: Development
        run: |
          set -euo pipefail
          sha=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/branches/${BUILD_BRANCH}" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["commit"]["sha"])')
          echo "Moving 'nightly' tag to ${BUILD_BRANCH} HEAD: ${sha}"
          curl -fsSL -X PATCH \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/tags/nightly" \
            -d "{\"sha\": \"${sha}\", \"force\": true}"
